name: CI

# Run on every push and every pull request
on:
  push:
  pull_request:

# The workflow only needs to read the code
permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The runner is a fresh, isolated machine, so a virtual environment is not needed.

      - name: Install dependencies
        # requirements-dev.txt = requirements.txt (pandas) + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        run: docker build --tag network-log-analyzer:ci .
