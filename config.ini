# Network Log Analyzer configuration
# Priority: command-line option > this file > built-in default.
# Relative paths are relative to the folder you run the program from.

[logging]
# DEBUG, INFO, WARNING or ERROR
level = INFO
file = logs/application.log

[reports]
csv_output = reports/log_report.csv
html_output = reports/network_log_report.html

[application]
# how many rows to show in "Top IP addresses" and "Top error messages"
top_n = 5
